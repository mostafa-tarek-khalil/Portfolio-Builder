<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../css/portfolio.css">
</head>
<body>
  <div id="previewBar" class="browser-bar" hidden>
    <div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="url-pill">
      <a id="urlLink" class="url-link" href="#" target="_blank" rel="noopener" title="Open your public portfolio">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 9h-1V7a4 4 0 00-8 0v2H7a2 2 0 00-2 2v8a2 2 0 002 2h10a2 2 0 002-2v-8a2 2 0 00-2-2zm-7-2a2 2 0 014 0v2h-4V7z"/></svg>
        <span id="urlText"></span>
      </a>
      <button type="button" class="copy-url" id="copyUrl"><i class="fa-regular fa-copy"></i> Copy</button>
    </div>
    <a class="back-btn" href="personalInfo.html"><i class="fa-solid fa-arrow-left"></i> Back to Personal Info</a>
  </div>
  <div id="app"></div>

  <!-- Small Save button: not part of the portfolio design -->
  <button id="saveBtn" class="save-btn" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
    <span>Save</span>
  </button>

  <script src="../js/portfolio.js"></script>
    <script src="../js/fx.js"></script>
</body>
</html>
